name: CI
on:
  pull_request:
  push:
    branches: [main]
    tags: ['*']
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Oldest supported stack: PHP 7.4 components on datadir-tests 5.x / PHPUnit 9
          - php: '7.4'
            deps: lowest
          - php: '8.3'
            deps: highest
          - php: '8.5'
            deps: highest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - uses: ramsey/composer-install@v3
        with:
          dependency-versions: ${{ matrix.deps }}
      - run: composer ci
